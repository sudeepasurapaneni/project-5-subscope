kind = "web"
previewPath = "/"
title = "SubScope — CT Data Analyzer"
description = "An offline educational tool for analyzing user-provided Certificate Transparency records for authorized assessments. It validates domain boundaries, deduplicates candidates, and exports transparent CSV results without external lookups or DNS checks."
version = "1.0.0"
id = "artifacts/subscope"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19842

[services.development]
run = "pnpm --filter @workspace/subscope run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/subscope", "run", "build" ]
serve = "static"
publicDir = "artifacts/subscope/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19842"
BASE_PATH = "/"
